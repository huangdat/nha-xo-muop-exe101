<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FBF8F3"/>
  <!-- Loofah illustration -->
  <g transform="translate(200, 140)">
    <!-- Natural Loofah cylindrical shape -->
    <ellipse cx="0" cy="0" rx="60" ry="85" fill="#EAD9BA" stroke="#C4A77D" stroke-width="2.5"/>
    <ellipse cx="0" cy="-30" rx="16" ry="22" fill="#FBF8F3"/>
    <ellipse cx="-24" cy="20" rx="20" ry="16" fill="#FBF8F3"/>
    <ellipse cx="24" cy="20" rx="20" ry="16" fill="#FBF8F3"/>
    <!-- Mesh accents -->
    <path d="M-45,-40 Q0,-70 45,-40" stroke="#9A7C52" stroke-width="1.8" fill="none" opacity="0.4"/>
    <path d="M-50,0 Q0,-30 50,0" stroke="#9A7C52" stroke-width="1.8" fill="none" opacity="0.4"/>
    <path d="M-45,40 Q0,10 45,40" stroke="#9A7C52" stroke-width="1.8" fill="none" opacity="0.4"/>
  </g>
</svg>
