<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FBF8F3"/>
  <!-- Glycerin & botanical extract -->
  <g transform="translate(200, 135)">
    <!-- Glass bowl / beaker -->
    <path d="M-50,-30 L-35,60 C-35,75 35,75 35,60 L50,-30 Z" fill="#EBF3ED" stroke="#4A7C59" stroke-width="2"/>
    <!-- Liquid -->
    <path d="M-40,0 L-32,55 C-32,68 32,68 32,55 L40,0 Z" fill="#B7D9BF" opacity="0.7"/>
    <!-- Herbs dipping in -->
    <path d="M10,-40 Q25,-10 0,30" stroke="#2D5A27" stroke-width="3" fill="none"/>
    <ellipse cx="20" cy="-20" rx="10" ry="5" fill="#3B6747" transform="rotate(-30 20 -20)"/>
    <ellipse cx="8" cy="5" rx="10" ry="5" fill="#3B6747" transform="rotate(30 8 5)"/>
  </g>
</svg>
