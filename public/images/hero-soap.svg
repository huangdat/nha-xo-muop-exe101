<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFE6"/>
      <stop offset="50%" stop-color="#EAE3D2"/>
      <stop offset="100%" stop-color="#DFD5BE"/>
    </linearGradient>
    <linearGradient id="soapHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558864"/>
      <stop offset="50%" stop-color="#3B6B4A"/>
      <stop offset="100%" stop-color="#244B30"/>
    </linearGradient>
    <linearGradient id="loofahHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFBE"/>
      <stop offset="100%" stop-color="#D7BA88"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2D3A2C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="650" rx="28" fill="url(#bgGrad)"/>

  <!-- Organic botanical shapes in background -->
  <circle cx="680" cy="120" r="140" fill="#E2DAC6" opacity="0.6"/>
  <circle cx="120" cy="520" r="180" fill="#E5DDCA" opacity="0.7"/>

  <!-- Botanical branch left -->
  <g opacity="0.35" transform="translate(60, 80) rotate(-15)">
    <path d="M0,200 Q80,120 160,40" stroke="#4A7C59" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="60" cy="140" rx="24" ry="12" fill="#4A7C59" transform="rotate(-30 60 140)"/>
    <ellipse cx="110" cy="90" rx="26" ry="13" fill="#4A7C59" transform="rotate(25 110 90)"/>
    <ellipse cx="150" cy="45" rx="22" ry="11" fill="#4A7C59" transform="rotate(-15 150 45)"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="490" rx="260" ry="42" fill="#2D3A2C" opacity="0.12"/>
  <ellipse cx="400" cy="485" rx="190" ry="26" fill="#2D3A2C" opacity="0.15"/>

  <!-- Main Soap Bar (Isometric / Perspective 3D look) -->
  <g filter="url(#softShadow)" transform="translate(400, 310)">
    <!-- Soap Base Body -->
    <rect x="-180" y="-120" width="360" height="240" rx="46" fill="url(#soapHeroGrad)"/>
    <rect x="-170" y="-110" width="340" height="220" rx="40" fill="none" stroke="#75A683" stroke-width="3" opacity="0.4"/>

    <!-- Embedded Natural Loofah Disc -->
    <g transform="translate(-50, 0)">
      <!-- Loofah Body -->
      <ellipse cx="0" cy="0" rx="95" ry="85" fill="url(#loofahHeroGrad)"/>
      <ellipse cx="0" cy="0" rx="90" ry="80" fill="none" stroke="#BFA06B" stroke-width="2" opacity="0.5"/>
      <!-- Loofah Core 3-part Star Holes -->
      <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#8C6D53" opacity="0.35"/>
      <ellipse cx="-20" cy="14" rx="18" ry="14" fill="#8C6D53" opacity="0.35"/>
      <ellipse cx="20" cy="14" rx="18" ry="14" fill="#8C6D53" opacity="0.35"/>
      <!-- Organic fibrous texture mesh -->
      <path d="M-60,-40 Q-20,-70 20,-50 Q60,-30 60,10 Q50,60 0,65 Q-55,50 -60,-40" 
            stroke="#9E7E50" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6"/>
      <path d="M-40,-20 Q-10,-45 25,-25 Q45,-5 35,35 Q-5,45 -40,15 Z" 
            stroke="#9E7E50" stroke-width="1.8" stroke-dasharray="4,3" fill="none" opacity="0.55"/>
      <!-- Small pores -->
      <circle cx="-45" cy="-25" r="3" fill="#8C6D53" opacity="0.4"/>
      <circle cx="45" cy="-15" r="3" fill="#8C6D53" opacity="0.4"/>
      <circle cx="-35" cy="35" r="3.5" fill="#8C6D53" opacity="0.4"/>
      <circle cx="35" cy="30" r="3.5" fill="#8C6D53" opacity="0.4"/>
      <circle cx="0" cy="-55" r="2.5" fill="#8C6D53" opacity="0.4"/>
      <circle cx="0" cy="45" r="2.5" fill="#8C6D53" opacity="0.4"/>
    </g>

    <!-- Soap Embossed Stamp on right -->
    <g transform="translate(100, 0)">
      <circle cx="0" cy="0" r="38" fill="none" stroke="#75A683" stroke-width="2" opacity="0.6"/>
      <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" 
            letter-spacing="2" fill="#E8F0E6" text-anchor="middle" opacity="0.9">100% ORGANIC</text>
      <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" 
            letter-spacing="1" fill="#E8F0E6" text-anchor="middle" opacity="0.8">LOOFAH</text>
      <text x="0" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" 
            letter-spacing="1.5" fill="#E8F0E6" text-anchor="middle" opacity="0.7">SOAP BAR</text>
    </g>

    <!-- Natural Jute / Hemp String Loop for hanging -->
    <path d="M-180, -40 C-220,-80 -200,-130 -140,-120" stroke="#B89B72" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M-180, -40 C-220,-80 -200,-130 -140,-120" stroke="#7D623F" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,2" fill="none"/>
  </g>

  <!-- Lather Bubbles around bottom right -->
  <g transform="translate(560, 420)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="-6" cy="-6" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="28" cy="10" r="16" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="-25" cy="18" r="14" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="15" cy="-22" r="12" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="42" cy="-10" r="9" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Badge Tag: Handmade with Care -->
  <g transform="translate(620, 180)">
    <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#244B30"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" 
          letter-spacing="1" fill="#FAF8F5" text-anchor="middle">THỦ CÔNG 100%</text>
  </g>

  <!-- Badge Tag: Natural Loofah -->
  <g transform="translate(180, 480)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#FFFFFF" filter="url(#softShadow)"/>
    <circle cx="-60" cy="0" r="6" fill="#4A7C59"/>
    <text x="8" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" 
          fill="#2D3A2C" text-anchor="middle">XƠ MƯỚP TỰ NHIÊN</text>
  </g>
</svg>
