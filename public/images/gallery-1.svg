<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <rect width="500" height="400" fill="#F3EFE6"/>
  <!-- Sunny loofah drying rack scene -->
  <circle cx="400" cy="80" r="50" fill="#FFE5B4" opacity="0.6"/>
  <!-- Wooden rack -->
  <line x1="60" y1="280" x2="440" y2="280" stroke="#8C6D53" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="280" x2="100" y2="360" stroke="#664D36" stroke-width="6"/>
  <line x1="380" y1="280" x2="400" y2="360" stroke="#664D36" stroke-width="6"/>
  <!-- Hanging loofahs -->
  <g transform="translate(160, 210)">
    <line x1="0" y1="70" x2="0" y2="0" stroke="#8C6D53" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="35" ry="50" fill="#E6D3B1" stroke="#BA9C6F" stroke-width="2"/>
  </g>
  <g transform="translate(250, 190)">
    <line x1="0" y1="90" x2="0" y2="0" stroke="#8C6D53" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="32" ry="55" fill="#DFCA9E" stroke="#BA9C6F" stroke-width="2"/>
  </g>
  <g transform="translate(340, 220)">
    <line x1="0" y1="60" x2="0" y2="0" stroke="#8C6D53" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="30" ry="46" fill="#E6D3B1" stroke="#BA9C6F" stroke-width="2"/>
  </g>
</svg>
