<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <rect width="600" height="500" fill="#F4EDE1"/>
  <!-- Loofah trellis / green garden illustration -->
  <path d="M100,500 C150,300 200,200 300,100 C400,200 450,320 500,500 Z" fill="#E2DAC8" opacity="0.5"/>
  <!-- Trellis bamboo lines -->
  <line x1="120" y1="120" x2="480" y2="120" stroke="#B8A484" stroke-width="4"/>
  <line x1="120" y1="200" x2="480" y2="200" stroke="#B8A484" stroke-width="4"/>
  <line x1="180" y1="80" x2="180" y2="350" stroke="#B8A484" stroke-width="4"/>
  <line x1="300" y1="80" x2="300" y2="350" stroke="#B8A484" stroke-width="4"/>
  <line x1="420" y1="80" x2="420" y2="350" stroke="#B8A484" stroke-width="4"/>

  <!-- Vines and leaves -->
  <path d="M160,350 Q200,160 300,120 Q400,120 440,350" stroke="#3D6B48" stroke-width="6" fill="none"/>
  <ellipse cx="230" cy="180" rx="22" ry="14" fill="#5A8E67" transform="rotate(-20 230 180)"/>
  <ellipse cx="370" cy="180" rx="22" ry="14" fill="#5A8E67" transform="rotate(20 370 180)"/>

  <!-- Hanging loofahs -->
  <g transform="translate(230, 260)">
    <line x1="0" y1="-40" x2="0" y2="0" stroke="#3D6B48" stroke-width="3"/>
    <ellipse cx="0" cy="30" rx="22" ry="45" fill="#43764F"/>
    <path d="M-10,15 Q0,45 10,15" stroke="#2B5234" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(370, 270)">
    <line x1="0" y1="-50" x2="0" y2="0" stroke="#3D6B48" stroke-width="3"/>
    <ellipse cx="0" cy="32" rx="20" ry="42" fill="#E2CEAA" stroke="#B39768" stroke-width="2"/>
  </g>
</svg>
