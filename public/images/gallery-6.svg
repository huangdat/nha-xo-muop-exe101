  <circle cx="250" cy="100" r="38" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="160" cy="200" r="26" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="330" cy="190" r="28" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="220" cy="235" r="24" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="280" cy="230" r="25" fill="#FFFFFF" opacity="0.85"/>
