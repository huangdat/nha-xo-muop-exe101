<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#FBF8F2"/>
  <!-- Kraft paper box packaging -->
  <g transform="translate(150, 140)">
    <rect x="-65" y="-65" width="130" height="130" rx="8" fill="#C9AE82" stroke="#AA8C5D" stroke-width="2"/>
    <!-- Jute rope cross -->
    <rect x="-65" y="-8" width="130" height="16" fill="#91744D"/>
    <rect x="-8" y="-65" width="16" height="130" fill="#91744D"/>
    <!-- Kraft tag -->
