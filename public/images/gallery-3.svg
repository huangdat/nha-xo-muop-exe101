<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <rect width="500" height="400" fill="#FAF6EE"/>
  <!-- Freshly poured soap blocks on wooden board -->
  <rect x="70" y="160" width="360" height="150" rx="12" fill="#E4D6BE"/>
  <!-- 3 soap bars curing -->
  <rect x="100" y="110" width="80" height="120" rx="18" fill="#3B6747"/>
  <rect x="210" y="110" width="80" height="120" rx="18" fill="#467352"/>
  <rect x="320" y="110" width="80" height="120" rx="18" fill="#3B6747"/>
  <!-- Embedded circle slices -->
  <circle cx="140" cy="170" r="24" fill="#E6D3B1" opacity="0.9"/>
  <circle cx="250" cy="170" r="24" fill="#E6D3B1" opacity="0.9"/>
  <circle cx="360" cy="170" r="24" fill="#E6D3B1" opacity="0.9"/>
</svg>
