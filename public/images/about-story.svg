<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#ECE3D4"/>
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D3A2C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="700" height="550" fill="url(#aboutBg)"/>
  
  <!-- Craft board / Wooden texture backdrop -->
  <rect x="80" y="80" width="540" height="390" rx="16" fill="#F4EFE6" stroke="#D8CDBA" stroke-width="2"/>
  
  <!-- Loofah slice art -->
  <g transform="translate(250, 260)" filter="url(#aboutShadow)">
    <circle cx="0" cy="0" r="100" fill="#E6D3B3"/>
    <circle cx="0" cy="0" r="94" fill="none" stroke="#C4A77D" stroke-width="2.5" stroke-dasharray="8,5"/>
    <!-- Triangular loofah center spaces -->
    <ellipse cx="0" cy="-28" rx="18" ry="24" fill="#FAF6F0"/>
    <ellipse cx="-26" cy="18" rx="22" ry="18" fill="#FAF6F0"/>
    <ellipse cx="26" cy="18" rx="22" ry="18" fill="#FAF6F0"/>
    <circle cx="0" cy="0" r="12" fill="#E6D3B3"/>
  </g>

  <!-- Soap slice overlapping -->
  <g transform="translate(420, 280)" filter="url(#aboutShadow)">
    <rect x="-80" y="-90" width="160" height="180" rx="28" fill="#3D6B48"/>
    <rect x="-70" y="-80" width="140" height="160" rx="22" fill="none" stroke="#689E74" stroke-width="2" opacity="0.6"/>
    <!-- Stamp -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#8CB896" stroke-width="1.5"/>
    <path d="M-12,0 C-12,-15 12,-15 12,0 C12,15 -12,15 -12,0 Z" fill="#8CB896" opacity="0.8"/>
  </g>

  <!-- Hanging rope -->
  <path d="M420, 190 Q440,110 390,90" stroke="#9A7B56" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Botanical branch -->
  <g transform="translate(520, 140) rotate(20)" opacity="0.7">
    <path d="M0,120 Q30,60 70,0" stroke="#3D6B48" stroke-width="3" fill="none"/>
    <ellipse cx="20" cy="80" rx="14" ry="8" fill="#588563" transform="rotate(-30 20 80)"/>
    <ellipse cx="45" cy="45" rx="14" ry="8" fill="#588563" transform="rotate(30 45 45)"/>
  </g>
</svg>
